# Validates this repository on every change:
#   lint       actionlint + shellcheck + zizmor over every workflow, the action and the CI scripts
#   unit       pytest for the scanner, merger and report
#   consumer   calls the reusable workflow exactly as a consumer would, on two fixtures, with the
#              scanner built from this commit and publishing off; then asserts the planted flaws
#              were caught and that no scanner errored
name: validate

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions: {}

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Install linters
        run: python -m pip install --quiet actionlint-py shellcheck-py zizmor
      - name: actionlint (includes shellcheck of every run block)
        run: actionlint -color
      - name: shellcheck the CI scripts
        run: shellcheck ci/sawone-scan.sh scripts/*.sh
      - name: every action pinned to a commit SHA
        run: scripts/pin-actions.sh --check
      - name: zizmor
        run: zizmor --config .github/zizmor.yml --offline .github/workflows action.yml
      - name: Install Graphviz System Dependency
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
        shell: bash


  unit:
    name: unit tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - 