# Reusable: monitor the images you actually run. Re-scans each image digest against today's
# vulnerability data and the CISA KEV / EPSS feeds — new CVEs appear without any code change —
# then keeps one GitHub issue up to date and fails the run (which notifies you) per fail-on.
#
#   on:
#     schedule: [{ cron: "23 4 * * *" }]   # daily
#   jobs:
#     monitor:
#       permissions: { contents: read, packages: read, issues: write }
#       uses: hackin2minutes-oss/sawone/.github/workflows/sawone-monitor.yml@<commit-sha>
#       with:
#         images: |
#           ghcr.io/acme/shop@sha256:4f1c…
#           ghcr.io/acme/api@sha256:9ab2…
#
# Prefer digests (what is deployed) over tags (what was pushed last). images-file can point at a
# file in your repository that your deployment updates, e.g. deploy/images.txt.
name: sawone-monitor

on:
  workflow_call:
    inputs:
      images:
        description: Images to monitor, one per line (repo@sha256:… recommended)
        type: string
        default: ""
      images-file:
        description: File in your repository listing images, one per line ('#' comments allowed)
        type: string
        default: ""
      gate-severity:
        type: string
        default: "HIGH,CRITICAL"
      fail-on:
        description: "kev = fail when a running image has a known-exploited CVE; blocking = any blocking finding; none = never fail"
        type: string
        default: kev
      epss-threshold:
        type: string
        default: "0"
      baseline-file:
        description: Accepted-risk file in your repository (same format as the scan's)
        type: string
        default: ".sawone-baseline.yml"
      open-issue:
        description: Keep one GitHub issue updated with the current state
        type: boolean
        default: true
      scanner-image:
        type: string
        default: ghcr.io/hackin2minutes-oss/sawone-scanner:1
      scanner-identity-regexp:
        type: string
        default: '^https://github\.com/hackin2minutes-oss/sawone/\.github/workflows/release\.yml@'
      artifact-prefix:
        type: string
        default: sawone-monitor
      runs-on:
        type: string
        default: ubuntu-24.04
    outputs:
      kev:
        description: Known-exploited CVEs found in the monitored images
        value: ${{ jobs.monitor.outputs.kev }}
      blocking:
        description: Blocking findings in the monitored images
        value: ${{ jobs.monitor.outputs.blocking }}

permissions: {}

jobs:
  monitor:
    name: monitor running images
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read # baseline and images-file
      packages: read # pull private GHCR images
      issues: write # keep the monitoring issue current
    outputs:
      kev: ${{ steps.eval.outputs.kev }}
      blocking: ${{ steps.eval.outputs.blocking }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate inputs and list images
        id: list
        env:
          IMAGES: ${{ inputs.images }}
          IMAGES_FILE: ${{ inputs.images-file }}
          FAIL_ON: ${{ inputs.fail-on }}
          EPSS: ${{ inputs.epss-threshold }}
          PREFIX: ${{ inputs.artifact-prefix }}
        run: |
          set -euo pipefail
          errors=0
          fail() { echo "::error title=sawone monitor input::$1"; errors=$((errors + 1)); }
          case "$FAIL_ON" in kev|blocking|none) ;; *) fail "fail-on must be kev, blocking or none";; esac
          epss_re='^(0(\.[0-9]+)?|1(\.0+)?)$'
          [[ "$EPSS" =~ $epss_re ]] || fail "epss-threshold must be between 0 and 1"
          [[ "$PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,40}$ ]] || fail "artifact-prefix is invalid"
          list="$RUNNER_TEMP/images.txt"
          printf '%s\n' "$IMAGES" > "$list"
          if [ -n "$IMAGES_FILE" ]; then
            f="$(realpath -m "$GITHUB_WORKSPACE/$IMAGES_FILE")"
            if [[ "$f" == "$GITHUB_WORKSPACE/"* ]] && [ -f "$f" ]; then cat "$f" >> "$list"
            else fail "images-file '$IMAGES_FILE' not found in the repository"; fi
          fi
          sed -i -e 's/#.*//' -e 's/[[:space:]]//g' -e '/^$/d' "$list"
          sort -u -o "$list" "$list"
          ref_re='^[a-z0-9.-]+(:[0-9]+)?(/[a-z0-9._-]+)+((:[A-Za-z0-9._-]+)?(@sha256:[a-f0-9]{64})?)$'
          while read -r img; do
            [[ "$img" =~ $ref_re ]] || fail "not an image reference: $img"
            [[ "$img" == *@sha256:* ]] || echo "::warning::$img is a tag, not a digest: you may be scanning something other than what runs"
          done < "$list"
          [ -s "$list" ] || fail "no images to monitor (set images or images-file)"
          [ "$errors" -eq 0 ] || exit 1
          echo "count=$(wc -l < "$list")" >> "$GITHUB_OUTPUT"
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.scanner-identity-regexp != ''
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Resolve and verify the scanner
        id: scanner
        env:
          SCANNER_IMAGE: ${{ inputs.scanner-image }}
          IDENTITY: ${{ inputs.scanner-identity-regexp }}
        run: |
          set -euo pipefail
          last="${SCANNER_IMAGE##*/}"
          if [[ "$SCANNER_IMAGE" == *@sha256:* ]]; then ref="$SCANNER_IMAGE"; else
            repo="$SCANNER_IMAGE"; [[ "$last" == *:* ]] && repo="${SCANNER_IMAGE%:*}"
            digest="$(docker buildx imagetools inspect "$SCANNER_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
            [[ "$digest" == sha256:* ]] || { echo "::error::cannot resolve $SCANNER_IMAGE"; exit 1; }
            ref="$repo@$digest"
          fi
          if [ -n "$IDENTITY" ]; then
            cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
          fi
          docker pull -q "$ref"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Scan every image
        env:
          SCANNER: ${{ steps.scanner.outputs.ref }}
          SCAN_SEVERITY: ${{ inputs.gate-severity }}
          SCAN_EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
          SCAN_BASELINE: ${{ inputs.baseline-file }}
        run: |
          set -uo pipefail
          intel="$RUNNER_TEMP/intel"; parts="$RUNNER_TEMP/parts"; cache="$RUNNER_TEMP/sawone-cache"
          mkdir -p "$intel" "$parts" "$cache"
          for attempt in 1 2 3; do
            docker run --rm -v "$intel:$intel" "$SCANNER" --fetch-intel "$intel" && break
            sleep $((attempt * 10))
          done
          i=0
          while read -r img; do
            i=$((i + 1))
            echo "::group::$img"
            docker pull -q "$img" || echo "::error::cannot pull $img"
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
              -v "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" -w "$GITHUB_WORKSPACE" -v "$intel:$intel:ro" \
              -v "$cache:$cache" -e SCAN_CACHE_DIR="$cache" \
              -e SCAN_ONLY=container -e SCAN_IMAGE="$img" -e SCAN_SEVERITY -e SCAN_EPSS_THRESHOLD -e SCAN_BASELINE \
              -e SCAN_BLOCK_KEV=true -e SCAN_INTEL_DIR="$intel" -e SCAN_ENFORCE=false \
              -e REPO="$GITHUB_REPOSITORY" "$SCANNER" --path "$GITHUB_WORKSPACE" --reports "sawone-monitor-$i"
            sudo mv "$GITHUB_WORKSPACE/sawone-monitor-$i" "$parts/image-$i"
            echo "::endgroup::"
          done < "$RUNNER_TEMP/images.txt"
          docker run --rm -v "$RUNNER_TEMP:$RUNNER_TEMP" --entrypoint python3 -e REPO="$GITHUB_REPOSITORY" "$SCANNER" \
            /opt/sawone/merge_reports.py --out "$RUNNER_TEMP/report" "$parts"/image-*
          sudo chown -R "$(id -u)" "$RUNNER_TEMP/report"
          exit 0
      - name: Evaluate
        id: eval
        run: |
          set -euo pipefail
          r="$RUNNER_TEMP/report"
          [ -f "$r/summary.json" ] || { echo "::error::no monitoring report was produced"; exit 2; }
          kev="$(jq '[.[] | select(.kev and .gating)] | length' "$r/findings-consolidated.json")"
          blocking="$(jq '[.[] | select(.gating)] | length' "$r/findings-consolidated.json")"
          errors="$(jq '[.stages[] | select(.status == "error")] | length' "$r/summary.json")"
          { echo "kev=$kev"; echo "blocking=$blocking"; echo "errors=$errors"; } >> "$GITHUB_OUTPUT"
          {
            echo "## Sawone monitor"
            echo
            echo "Images: $(wc -l < "$RUNNER_TEMP/images.txt") · known-exploited CVEs: **$kev** · blocking findings: **$blocking** · scanner errors: $errors"
            echo
            jq -r '.[] | select(.kev) | "- 🔥 **\(.id)** in `\(.package) \(.version)` (\(.location)) — fix: \(.fixed_version // "none yet")"' \
              "$r/findings-consolidated.json" | head -50
            echo
            tail -n +2 "$r/summary.md"
          } > "$RUNNER_TEMP/monitor.md"
          cat "$RUNNER_TEMP/monitor.md" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ${{ inputs.artifact-prefix }}-report
          path: ${{ runner.temp }}/report
          retention-days: 30
          if-no-files-found: warn
      - name: Update the monitoring issue
        if: inputs.open-issue && steps.eval.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          KEV: ${{ steps.eval.outputs.kev }}
          BLOCKING: ${{ steps.eval.outputs.blocking }}
          PREFIX: ${{ inputs.artifact-prefix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          marker="<!-- sawone-monitor:$PREFIX -->"
          body="$RUNNER_TEMP/issue.md"
          { echo "$marker"; head -c 60000 "$RUNNER_TEMP/monitor.md"; echo; echo "<sub>[Latest run]($RUN_URL)</sub>"; } > "$body"
          num="$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --paginate \
                 --jq ".[] | select(.pull_request == null and (.body // \"\" | startswith(\"$marker\"))) | .number" | head -1)"
          if [ "$KEV" -gt 0 ] || [ "$BLOCKING" -gt 0 ]; then
            title="Sawone monitor: $KEV known-exploited CVE(s), $BLOCKING blocking finding(s) in running images"
            if [ -n "$num" ]; then
              gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$num" -f "title=$title" -F "body=@$body" > /dev/null
            else
              gh api -X POST "repos/$GITHUB_REPOSITORY/issues" -f "title=$title" -F "body=@$body" > /dev/null
            fi
          elif [ -n "$num" ]; then
            gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$num/comments" -f "body=All monitored images are clean as of $RUN_URL" > /dev/null
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/$num" -f state=closed > /dev/null
          fi
      - name: Result
        env:
          FAIL_ON: ${{ inputs.fail-on }}
          KEV: ${{ steps.eval.outputs.kev }}
          BLOCKING: ${{ steps.eval.outputs.blocking }}
          ERRORS: ${{ steps.eval.outputs.errors }}
        run: |
          [ "${ERRORS:-0}" -gt 0 ] && { echo "::error::$ERRORS scanner error(s) while monitoring"; exit 2; }
          case "$FAIL_ON" in
            kev) [ "$KEV" -gt 0 ] && { echo "::error::$KEV known-exploited CVE(s) in running images"; exit 1; } ;;
            blocking) [ "$BLOCKING" -gt 0 ] && { echo "::error::$BLOCKING blocking finding(s) in running images"; exit 1; } ;;
          esac
          echo "monitoring complete"

      - name: Install Graphviz System Dependency
        run: |
          sudo apt-get update && sudo apt-get install -y graphviz
        shell: bash
