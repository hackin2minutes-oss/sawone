# Reusable DevSecOps scan pipeline (read-only).
#
#   jobs:
#     scan:
#       permissions: { contents: read, actions: read, security-events: write }
#       uses: hackin2minutes-oss/sawone/.github/workflows/sawone-scan.yml@<commit-sha>
#
#   validate ─► tools (scanner digest, tool lock, KEV/EPSS feeds, warmed vulnerability DB cache)
#     ├─► gates  (matrix: threat-model, secrets, sast, sca, iac, kubernetes, cicd)
#     └─► build  (image + container gate) ─► attack (matrix: dast, iast, runtime)
#   report (always: merges every part, de-duplicates findings, applies baseline + KEV/EPSS policy,
#           compares with the base branch on pull requests, compliance map, PDF, SARIF)
#     └─► defectdojo (optional)
#
# Pull requests get a fast scan (ZAP baseline + API, no active scan) and, with pr-gate: new, only
# findings introduced by the change block; pushes and schedules get the deep scan. PR comments come
# from sawone-pr-comment.yml, a separate call that needs pull-requests: write.
#
# Every job here is read-only towards GitHub, so it is safe on pull requests, including forks.
# Publishing, signing, SLSA provenance and deployment live in sawone-release.yml, which you
# call after this workflow only on trusted pushes. They are separate because GitHub checks a
# called workflow's job permissions before evaluating any `if:` — keeping them in one file
# would force every caller to grant packages/id-token write even when nothing is published.
name: sawone-scan

on:
  workflow_call:
    inputs:
      path:
        description: Directory to scan, relative to the repository root
        type: string
        default: "."
      config:
        description: Scanner config file, relative to path
        type: string
        default: ".sawone.yml"
      dockerfile:
        description: Dockerfile to build, relative to the repository root ('' = <path>/Dockerfile when it exists)
        type: string
        default: ""
      build-context:
        description: Docker build context, relative to the repository root ('' = the Dockerfile's directory)
        type: string
        default: ""
      gate-severity:
        description: Severities that fail a gate, e.g. HIGH,CRITICAL
        type: string
        default: "HIGH,CRITICAL"
      enforce:
        description: false = report only (gate failures do not fail the run)
        type: boolean
        default: true
      fail-on-scanner-error:
        description: Fail the run when any scanner crashed, even in report-only mode
        type: boolean
        default: true
      skip-tools:
        description: Comma-separated tools to skip, e.g. "nuclei,checkov"
        type: string
        default: ""
      tool-version-policy:
        description: >-
          latest = resolve every tool to its newest release once per run and pin it by digest/version for all jobs;
          bundled = use the lock file shipped inside the scanner image;
          file = use tools-lock-file from your repository
        type: string
        default: latest
      tools-lock-file:
        description: Tool lock file in your repository (tool-version-policy file)
        type: string
        default: ""
      scanner-image:
        description: Scanner image (tag or @sha256 digest); resolved to a digest once per run
        type: string
        default: ghcr.io/hackin2minutes-oss/sawone-scanner:1
      scanner-identity-regexp:
        description: Signing identity the scanner image must have ('' = skip signature verification)
        type: string
        default: '^https://github\.com/hackin2minutes-oss/sawone/\.github/workflows/release\.yml@'
      scanner-source-path:
        description: Build the scanner from this directory of your checkout instead of pulling it (self-tests)
        type: string
        default: ""
      artifact-prefix:
        description: Prefix for every artifact name (must differ between calls in the same run)
        type: string
        default: sawone
      enable-threat-model:
        type: boolean
        default: true
      enable-secrets:
        type: boolean
        default: true
      enable-sast:
        type: boolean
        default: true
      enable-sca:
        type: boolean
        default: true
      enable-iac:
        type: boolean
        default: true
      enable-kubernetes:
        type: boolean
        default: true
      enable-cicd:
        type: boolean
        default: true
      enable-container:
        description: Build the image and run the container gate (needs a Dockerfile)
        type: boolean
        default: true
      enable-dast:
        type: boolean
        default: true
      dast-full-scan:
        description: Run the ZAP active (full) scan in addition to the baseline
        type: boolean
        default: true
      dast-ajax-spider:
        description: Also crawl with ZAP's AJAX spider (a real browser) — for JavaScript-heavy apps; slower
        type: boolean
        default: false
      dast-auth-header:
        description: Header that carries the dast-auth-value secret or the login token (e.g. Authorization, Cookie)
        type: string
        default: Authorization
      enable-runtime:
        description: Put ModSecurity + OWASP CRS in front of the app and check it blocks attacks
        type: boolean
        default: true
      enable-iast:
        description: Run the app with the DongTai agent (needs dongtai-url and iast-run-args)
        type: boolean
        default: false
      dongtai-url:
        type: string
        default: ""
      iast-run-args:
        description: docker run arguments that attach the agent, e.g. "-e JAVA_TOOL_OPTIONS=-javaagent:/agent.jar"
        type: string
        default: ""
      app-port:
        description: Port the app listens on (0 = read EXPOSE from the Dockerfile)
        type: number
        default: 0
      health-path:
        description: Readiness path ('' = try /health, /healthz, /actuator/health, /ready, /)
        type: string
        default: ""
      startup-timeout:
        description: Seconds to wait for the app to become ready
        type: number
        default: 60
      upload-sarif:
        description: "auto (public repositories only), always (also private repositories with GitHub Advanced Security) or never"
        type: string
        default: auto
      enable-defectdojo:
        type: boolean
        default: false
      defectdojo-url:
        description: DefectDojo base URL (https)
        type: string
        default: ""
      defectdojo-product:
        type: string
        default: ""
      defectdojo-engagement:
        type: string
        default: ""
      scan-depth:
        description: "auto (pull requests fast, everything else deep), fast (no ZAP active scan) or deep"
        type: string
        default: auto
      incremental:
        description: "auto (pull requests skip stages the change cannot affect, and secret/code scans look only at the change), on or off"
        type: string
        default: auto
      report-languages:
        description: "PDF report languages: en, ar or en,ar"
        type: string
        default: "en,ar"
      pr-gate:
        description: "On pull requests: new = only findings introduced by the change block (compared with the base branch's last report); all = every finding blocks"
        type: string
        default: new
      baseline-file:
        description: Accepted-risk file (owner, reason, expiry per finding), relative to path
        type: string
        default: ".sawone-baseline.yml"
      block-kev:
        description: CVEs in the CISA Known Exploited Vulnerabilities catalogue block at any severity
        type: boolean
        default: true
      epss-threshold:
        description: Also block CVEs whose EPSS exploit probability is at least this (0-1; "0" = off)
        type: string
        default: "0"
      runs-on:
        type: string
        default: ubuntu-24.04
    secrets:
      defectdojo-token:
        required: false
      dongtai-token:
        required: false
      dast-auth-value:
        description: Credential ZAP sends on every request, e.g. "Bearer eyJ…" or "session=…" (authenticated DAST)
        required: false
      dast-username:
        description: Login for dast.auth.login_url in .sawone.yml (authenticated DAST via a login call)
        required: false
      dast-password:
        required: false
    outputs:
      passed:
        description: "'true' when every gate passed and no scanner errored"
        value: ${{ jobs.report.outputs.passed }}
      failed:
        description: Number of failed gates
        value: ${{ jobs.report.outputs.failed }}
      new-blocking:
        description: Blocking findings introduced by this change (pull requests with a base report; else empty)
        value: ${{ jobs.report.outputs.new-blocking }}
      errors:
        description: Number of scanner errors
        value: ${{ jobs.report.outputs.errors }}
      report-artifact:
        value: ${{ jobs.report.outputs.artifact }}
      image-id:
        description: ID of the built image (input for sawone-release.yml; empty when nothing was built)
        value: ${{ jobs.build.outputs.image-id }}
      local-tag:
        description: Local tag of the built image inside the <artifact-prefix>-app-image artifact
        value: ${{ jobs.build.outputs.local-tag }}
      artifact-prefix:
        value: ${{ inputs.artifact-prefix }}

permissions: {}

jobs:
  validate:
    name: validate inputs
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      gate-stages: ${{ steps.plan.outputs.gate-stages }}
      attack-stages: ${{ steps.plan.outputs.attack-stages }}
      expected-parts: ${{ steps.plan.outputs.expected-parts }}
      dockerfile: ${{ steps.plan.outputs.dockerfile }}
      build-context: ${{ steps.plan.outputs.build-context }}
      has-image: ${{ steps.plan.outputs.has-image }}
      full-scan: ${{ steps.plan.outputs.full-scan }}
      depth: ${{ steps.plan.outputs.depth }}
      unchanged-stages: ${{ steps.plan.outputs.unchanged-stages }}
      base-sha: ${{ steps.plan.outputs.base-sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # incremental pull-request scans compare with the base commit
      - name: Validate inputs and plan the run
        id: plan
        env:
          IN_PATH: ${{ inputs.path }}
          IN_DOCKERFILE: ${{ inputs.dockerfile }}
          IN_CONTEXT: ${{ inputs.build-context }}
          IN_SEVERITY: ${{ inputs.gate-severity }}
          IN_POLICY: ${{ inputs.tool-version-policy }}
          IN_LOCK: ${{ inputs.tools-lock-file }}
          IN_SCANNER_SRC: ${{ inputs.scanner-source-path }}
          IN_PREFIX: ${{ inputs.artifact-prefix }}
          IN_PORT: ${{ inputs.app-port }}
          IN_HEALTH: ${{ inputs.health-path }}
          IN_TIMEOUT: ${{ inputs.startup-timeout }}
          IN_SARIF: ${{ inputs.upload-sarif }}
          IN_DD: ${{ inputs.enable-defectdojo }}
          IN_DD_URL: ${{ inputs.defectdojo-url }}
          HAS_DD_TOKEN: ${{ secrets.defectdojo-token != '' }}
          IN_IAST: ${{ inputs.enable-iast }}
          IN_DONGTAI_URL: ${{ inputs.dongtai-url }}
          IN_IAST_ARGS: ${{ inputs.iast-run-args }}
          EN_THREAT: ${{ inputs.enable-threat-model }}
          EN_SECRETS: ${{ inputs.enable-secrets }}
          EN_SAST: ${{ inputs.enable-sast }}
          EN_SCA: ${{ inputs.enable-sca }}
          EN_IAC: ${{ inputs.enable-iac }}
          EN_K8S: ${{ inputs.enable-kubernetes }}
          EN_CICD: ${{ inputs.enable-cicd }}
          EN_CONTAINER: ${{ inputs.enable-container }}
          EN_DAST: ${{ inputs.enable-dast }}
          EN_RUNTIME: ${{ inputs.enable-runtime }}
          IN_DEPTH: ${{ inputs.scan-depth }}
          IN_FULL: ${{ inputs.dast-full-scan }}
          IN_PR_GATE: ${{ inputs.pr-gate }}
          IN_BASELINE: ${{ inputs.baseline-file }}
          IN_EPSS: ${{ inputs.epss-threshold }}
          IN_INCREMENTAL: ${{ inputs.incremental }}
          IN_LANGS: ${{ inputs.report-languages }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          errors=0
          fail() { echo "::error title=sawone input::$1"; errors=$((errors + 1)); }
          ws="$(realpath "$GITHUB_WORKSPACE")"
          inside() { # path must exist and stay inside the checkout
            local p; p="$(realpath -m "$ws/$1")"
            [[ "$p" == "$ws" || "$p" == "$ws/"* ]] && [ -e "$p" ]
          }

          inside "$IN_PATH" && [ -d "$ws/$IN_PATH" ] || fail "path '$IN_PATH' is not a directory inside the repository"
          [[ "$IN_PREFIX" =~ ^[A-Za-z0-9][A-Za-z0-9_.-]{0,40}$ ]] || fail "artifact-prefix must be 1-41 characters of A-Z a-z 0-9 _ . -"

          for s in ${IN_SEVERITY//,/ }; do
            case "$s" in UNKNOWN|LOW|MEDIUM|HIGH|CRITICAL) ;; *) fail "gate-severity: unknown severity '$s'";; esac
          done
          [ -n "${IN_SEVERITY//[ ,]/}" ] || fail "gate-severity is empty"

          case "$IN_POLICY" in
            latest|bundled) ;;
            file) { [ -n "$IN_LOCK" ] && inside "$IN_LOCK" && jq -e '.images | type == "object"' "$ws/$IN_LOCK" >/dev/null; } \
                    || fail "tool-version-policy file needs tools-lock-file pointing to a valid lock file in the repository" ;;
            *) fail "tool-version-policy must be latest, bundled or file (got '$IN_POLICY')" ;;
          esac
          if [ -n "$IN_SCANNER_SRC" ]; then
            inside "$IN_SCANNER_SRC/Dockerfile" || fail "scanner-source-path '$IN_SCANNER_SRC' has no Dockerfile"
          fi

          [[ "$IN_PORT" =~ ^[0-9]+$ ]] && [ "$IN_PORT" -le 65535 ] || fail "app-port must be 0-65535"
          health_re='^/[A-Za-z0-9/._~%?=&-]*$'
          [ -z "$IN_HEALTH" ] || [[ "$IN_HEALTH" =~ $health_re ]] || fail "health-path must start with / and contain only URL path characters"
          [[ "$IN_TIMEOUT" =~ ^[0-9]+$ ]] && [ "$IN_TIMEOUT" -ge 5 ] && [ "$IN_TIMEOUT" -le 1800 ] || fail "startup-timeout must be 5-1800 seconds"
          case "$IN_SARIF" in auto|always|never|true|false) ;; *) fail "upload-sarif must be auto, always or never";; esac

          # image to build
          dockerfile="$IN_DOCKERFILE"
          if [ -z "$dockerfile" ] && [ -f "$ws/$IN_PATH/Dockerfile" ]; then dockerfile="$(realpath --relative-to="$ws" "$ws/$IN_PATH/Dockerfile")"; fi
          if [ -n "$dockerfile" ]; then
            inside "$dockerfile" && [ -f "$ws/$dockerfile" ] || fail "dockerfile '$dockerfile' not found in the repository"
          fi
          context="$IN_CONTEXT"
          if [ -n "$dockerfile" ] && [ -z "$context" ]; then context="$(dirname "$dockerfile")"; fi
          if [ -n "$context" ]; then inside "$context" && [ -d "$ws/$context" ] || fail "build-context '$context' is not a directory in the repository"; fi
          has_image=false
          if [ -n "$dockerfile" ] && [ "$EN_CONTAINER" = true ]; then has_image=true; fi

          # integrations
          if [ "$IN_DD" = true ]; then
            [[ "$IN_DD_URL" =~ ^https://[^[:space:]/]+ ]] || fail "defectdojo-url must be an https:// URL"
            [ "$HAS_DD_TOKEN" = true ] || fail "enable-defectdojo needs the defectdojo-token secret"
          fi
          if [ "$IN_IAST" = true ]; then
            [[ "$IN_DONGTAI_URL" =~ ^https?://[^[:space:]/]+ ]] || fail "enable-iast needs dongtai-url (http:// or https://)"
            [ -n "$IN_IAST_ARGS" ] || fail "enable-iast needs iast-run-args that attach the agent"
            [ "$has_image" = true ] || fail "enable-iast needs a Dockerfile to run the app"
          fi

          case "$IN_DEPTH" in auto|fast|deep) ;; *) fail "scan-depth must be auto, fast or deep";; esac
          case "$IN_PR_GATE" in new|all) ;; *) fail "pr-gate must be new or all";; esac
          case "$IN_INCREMENTAL" in auto|on|off) ;; *) fail "incremental must be auto, on or off";; esac
          for l in ${IN_LANGS//,/ }; do case "$l" in en|ar) ;; *) fail "report-languages: unknown language '$l' (en, ar)";; esac; done
          epss_re='^(0(\.[0-9]+)?|1(\.0+)?)$'
          [[ "$IN_EPSS" =~ $epss_re ]] || fail "epss-threshold must be a number between 0 and 1"
          if [ -n "$IN_BASELINE" ]; then
            b="$(realpath -m "$ws/$IN_PATH/$IN_BASELINE")"
            [[ "$b" == "$ws/"* ]] || fail "baseline-file must stay inside the repository"
          fi

          [ "$errors" -eq 0 ] || exit 1

          depth="$IN_DEPTH"
          if [ "$depth" = auto ]; then
            case "$EVENT" in pull_request|pull_request_target|merge_group) depth=fast ;; *) depth=deep ;; esac
          fi
          full=false
          if [ "$depth" = deep ] && [ "$IN_FULL" = true ]; then full=true; fi

          # plan
          gates=()
          [ "$EN_THREAT" = true ] && gates+=(threat-model)
          [ "$EN_SECRETS" = true ] && gates+=(secrets)
          [ "$EN_SAST" = true ] && gates+=(sast)
          [ "$EN_SCA" = true ] && gates+=(sca)
          [ "$EN_IAC" = true ] && gates+=(iac)
          [ "$EN_K8S" = true ] && gates+=(kubernetes)
          [ "$EN_CICD" = true ] && gates+=(cicd)

          # incremental pull requests: stages the change cannot affect are skipped (the base branch's
          # results apply) and the secret and code scans look only at the commits the change adds
          unchanged=()
          base_sha=""
          is_pr=false
          case "$EVENT" in pull_request|pull_request_target) is_pr=true ;; esac
          if { [ "$IN_INCREMENTAL" = on ] || { [ "$IN_INCREMENTAL" = auto ] && [ "$is_pr" = true ]; }; } \
             && [[ "$PR_BASE_SHA" =~ ^[0-9a-f]{40}$ ]] && git -C "$ws" cat-file -e "$PR_BASE_SHA^{commit}" 2>/dev/null; then
            base_sha="$PR_BASE_SHA"
            changed="$(git -C "$ws" diff --name-only "$base_sha...HEAD" -- "$IN_PATH")"
            has() { grep -Eq "$1" <<< "$changed"; }
            keep=()
            for g in "${gates[@]}"; do
              case "$g" in
                sca)          has '(^|/)(requirements[^/]*\.txt|Pipfile(\.lock)?|poetry\.lock|pyproject\.toml|uv\.lock|setup\.py|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|npm-shrinkwrap\.json|pom\.xml|build\.gradle(\.kts)?|gradle\.lockfile|go\.(mod|sum)|Gemfile(\.lock)?|composer\.(json|lock)|Cargo\.(toml|lock)|[^/]*\.csproj|packages\.(config|lock\.json)|mix\.lock|pubspec\.lock|Package\.resolved|conan\.lock)$' && keep+=(sca) || unchanged+=(sca) ;;
                iac)          has '(\.tf|\.tfvars|\.hcl|\.bicep|\.json|\.ya?ml|\.template)$|(^|/)[^/]*Dockerfile[^/]*$|(^|/)Containerfile$' && keep+=(iac) || unchanged+=(iac) ;;
                kubernetes)   has '(\.ya?ml|\.tpl|\.json)$|(^|/)Chart\.(yaml|lock)$' && keep+=(kubernetes) || unchanged+=(kubernetes) ;;
                cicd)         has '(^|/)\.github/(workflows/|actions/)|(^|/)action\.ya?ml$' && keep+=(cicd) || unchanged+=(cicd) ;;
                threat-model) has '(^|/)threatmodel/|threagile\.ya?ml$' && keep+=(threat-model) || unchanged+=(threat-model) ;;
                *) keep+=("$g") ;;
              esac
            done
            gates=("${keep[@]}")
          fi
          attack=()
          if [ "$has_image" = true ]; then
            [ "$EN_DAST" = true ] && attack+=(dast)
            [ "$IN_IAST" = true ] && attack+=(iast)
            [ "$EN_RUNTIME" = true ] && attack+=(runtime)
          fi
          parts=()
          for s in "${gates[@]}" "${attack[@]}"; do parts+=("$IN_PREFIX-part-$s"); done
          [ "$has_image" = true ] && parts+=("$IN_PREFIX-part-container")
          to_json() { if [ $# -eq 0 ]; then echo '[]'; else printf '%s\n' "$@" | jq -R . | jq -cs .; fi; }
          {
            echo "gate-stages=$(to_json "${gates[@]}")"
            echo "attack-stages=$(to_json "${attack[@]}")"
            echo "expected-parts=$(IFS=,; echo "${parts[*]}")"
            echo "dockerfile=$dockerfile"
            echo "build-context=$context"
            echo "has-image=$has_image"
            echo "depth=$depth"
            echo "full-scan=$full"
            echo "unchanged-stages=$(IFS=,; echo "${unchanged[*]}")"
            echo "base-sha=$base_sha"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Sawone plan"
            echo "- gates: ${gates[*]:-none}"
            echo "- image: ${dockerfile:-none} (build $has_image)"
            echo "- attacks: ${attack[*]:-none} (depth: $depth, ZAP active scan: $full)"
            if [ -n "$base_sha" ]; then
              echo "- incremental: compared with ${base_sha:0:12}; not affected by the change: ${unchanged[*]:-none}"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  tools:
    name: resolve tools
    needs: validate
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      scanner: ${{ steps.scanner.outputs.ref }}
      cache-key: ${{ steps.cachekey.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: inputs.scanner-source-path != '' || inputs.tool-version-policy == 'file'
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        if: inputs.scanner-source-path == '' && inputs.scanner-identity-regexp != ''
      - name: Resolve the scanner image to a digest
        id: scanner
        env:
          SCANNER_IMAGE: ${{ inputs.scanner-image }}
          SCANNER_SRC: ${{ inputs.scanner-source-path }}
          IDENTITY: ${{ inputs.scanner-identity-regexp }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sawone-tools"
          mkdir -p "$out"
          if [ -n "$SCANNER_SRC" ]; then
            ref="sawone-scanner:run-$GITHUB_RUN_ID"
            docker build --pull -t "$ref" "$GITHUB_WORKSPACE/$SCANNER_SRC"
            docker save -o "$out/scanner.tar" "$ref"
          else
            last="${SCANNER_IMAGE##*/}"
            if [[ "$SCANNER_IMAGE" == *@sha256:* ]]; then
              ref="$SCANNER_IMAGE"
            else
              repo="$SCANNER_IMAGE"; [[ "$last" == *:* ]] && repo="${SCANNER_IMAGE%:*}"
              digest="$(docker buildx imagetools inspect "$SCANNER_IMAGE" --format '{{json .Manifest}}' | jq -r .digest)"
              [[ "$digest" == sha256:* ]] || { echo "::error::cannot resolve $SCANNER_IMAGE to a digest"; exit 1; }
              ref="$repo@$digest"
            fi
            if [ -n "$IDENTITY" ]; then
              cosign verify "$ref" --certificate-identity-regexp "$IDENTITY" \
                --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
              echo "scanner signature verified: $ref"
            else
              echo "::warning::scanner-identity-regexp is empty: the scanner image signature was not verified"
            fi
            docker pull -q "$ref"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
      - name: Resolve tool versions
        env:
          POLICY: ${{ inputs.tool-version-policy }}
          LOCK_FILE: ${{ inputs.tools-lock-file }}
          SCANNER: ${{ steps.scanner.outputs.ref }}
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/sawone-tools"
          case "$POLICY" in
            latest)
              # resolve every tool once; every job in this run then uses exactly these digests/versions
              docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$out:$out" \
                "$SCANNER" --resolve-tools "$out/tools.lock.json" ;;
            bundled)
              docker run --rm --entrypoint cat "$SCANNER" /opt/sawone/defaults/tools.lock.json > "$out/tools.lock.json" \
                || { echo "::error::this scanner image has no bundled tool lock; use tool-version-policy latest"; exit 1; } ;;
            file)
              cp "$GITHUB_WORKSPACE/$LOCK_FILE" "$out/tools.lock.json" ;;
          esac
          jq -e '.images | length > 0' "$out/tools.lock.json" > /dev/null || { echo "::error::tool lock is empty or invalid"; exit 1; }
          echo "$POLICY" > "$out/policy"
          {
            echo "### Tool versions ($POLICY)"
            echo '```'
            jq -r '(.images | to_entries[] | "\(.key)\t\(.value)"), (.pip | to_entries[] | "\(.key)\t\(.value)")' "$out/tools.lock.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fetch CISA KEV and EPSS once for the whole run
        env:
          SCANNER: ${{ steps.scanner.outputs.ref }}
          BLOCK_KEV: ${{ inputs.block-kev }}
          EPSS: ${{ inputs.epss-threshold }}
        run: |
          set -uo pipefail
          out="$RUNNER_TEMP/sawone-tools/intel"
          mkdir -p "$out"
          for attempt in 1 2 3; do
            docker run --rm -v "$out:$out" "$SCANNER" --fetch-intel "$out" && break
            sleep $((attempt * 10))
          done
          if [ ! -s "$out/kev.json" ] && [ "$BLOCK_KEV" = true ]; then
            echo "::error::CISA KEV feed unavailable while block-kev is on; the scan parts will report it as an error"
          fi
          if [ ! -s "$out/epss.csv.gz" ] && [ "$EPSS" != "0" ]; then
            echo "::error::EPSS feed unavailable while epss-threshold is set"
          fi
          exit 0
      - name: Cache key (vulnerability databases, one per day)
        id: cachekey
        run: echo "key=sawone-vulndb-${RUNNER_OS}-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sawone-cache
          key: ${{ steps.cachekey.outputs.key }}
          restore-keys: sawone-vulndb-${{ runner.os }}-
      - name: Warm the Trivy and Grype databases for every job
        env:
          SCANNER: ${{ steps.scanner.outputs.ref }}
        run: |
          set -uo pipefail
          cache="$RUNNER_TEMP/sawone-cache"
          lock="$RUNNER_TEMP/sawone-tools/tools.lock.json"
          mkdir -p "$cache/trivy" "$cache/grype"
          trivy="$(jq -r '.images.trivy // empty' "$lock")"
          grype="$(jq -r '.images.grype // empty' "$lock")"
          [ -n "$trivy" ] && docker run --rm -v "$cache/trivy:/root/.cache/trivy" "$trivy" image --download-db-only \
            || echo "::warning::Trivy DB warm-up failed; each job will download it"
          [ -n "$grype" ] && docker run --rm -u 0:0 -v "$cache/grype:/grype-db" -e GRYPE_DB_CACHE_DIR=/grype-db "$grype" db update \
            || echo "::warning::Grype DB warm-up failed; each job will download it"
          sudo chmod -R a+rwX "$cache"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
          retention-days: 3
          if-no-files-found: error

  gates:
    name: gate ${{ matrix.stage }}
    needs: [validate, tools]
    if: needs.validate.outputs.gate-stages != '[]'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.validate.outputs.gate-stages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # secret scanners read the history
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sawone-cache
          key: ${{ needs.tools.outputs.cache-key }}
          restore-keys: sawone-vulndb-${{ runner.os }}-
      - name: Load scanner built from source
        if: inputs.scanner-source-path != ''
        run: docker load -q -i "$RUNNER_TEMP/sawone-tools/scanner.tar"
      - name: Scan (${{ matrix.stage }})
        id: scan
        env:
          SCANNER: ${{ needs.tools.outputs.scanner }}
          SCAN_ONLY: ${{ matrix.stage }}
          SCAN_PATH_IN: ${{ inputs.path }}
          SCAN_CONFIG: ${{ inputs.config }}
          SCAN_SEVERITY: ${{ inputs.gate-severity }}
          SCAN_ENFORCE: ${{ inputs.enforce }}
          SCAN_SKIP: ${{ inputs.skip-tools }}
          SCAN_BASELINE: ${{ inputs.baseline-file }}
          SCAN_BLOCK_KEV: ${{ inputs.block-kev }}
          SCAN_EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
          # incremental pull requests: secrets and SAST look only at what the change adds
          SCAN_BASE_SHA: ${{ (matrix.stage == 'secrets' || matrix.stage == 'sast') && needs.validate.outputs.base-sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          target="$(realpath "$GITHUB_WORKSPACE/$SCAN_PATH_IN")"
          tools="$RUNNER_TEMP/sawone-tools"
          # mount only the scan root (same as the single-step action): with the whole checkout
          # visible, Semgrep anchors at the Git root and its default ignore list (tests/, test/ …)
          # silently drops a scan root that lives under such a directory
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$target:$target" -w "$target" -v "$tools:$tools:ro" \
            -e SCAN_ONLY -e SCAN_CONFIG -e SCAN_SEVERITY -e SCAN_ENFORCE -e SCAN_SKIP -e GH_TOKEN -e SCAN_BASE_SHA \
            -e SCAN_TOOLS_LOCK="$tools/tools.lock.json" -e SCAN_INTEL_DIR="$tools/intel" \
            -e SCAN_BASELINE -e SCAN_BLOCK_KEV -e SCAN_EPSS_THRESHOLD \
            -e SCAN_CACHE_DIR="$RUNNER_TEMP/sawone-cache" -v "$RUNNER_TEMP/sawone-cache:$RUNNER_TEMP/sawone-cache" \
            -e REPO="$GITHUB_REPOSITORY" -e SHA="$GITHUB_SHA" -e REF="$GITHUB_REF" \
            -e RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            "$SCANNER" --path "$target" --reports sawone-reports
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reports=$target/sawone-reports" >> "$GITHUB_OUTPUT"
          [ -f "$target/sawone-reports/summary.md" ] && cat "$target/sawone-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outputs.reports != ''
        with:
          name: ${{ inputs.artifact-prefix }}-part-${{ matrix.stage }}
          path: ${{ steps.scan.outputs.reports }}
          retention-days: 7
          if-no-files-found: warn
      - name: Result
        env:
          CODE: ${{ steps.scan.outputs.code }}
        run: |
          case "$CODE" in
            0) echo "passed" ;;
            1) echo "::error::gate failed"; exit 1 ;;
            *) echo "::error::scanner error (exit ${CODE:-none})"; exit 2 ;;
          esac

  build:
    name: build + container gate
    needs: [validate, tools]
    if: needs.validate.outputs.has-image == 'true'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    outputs:
      local-tag: ${{ steps.build.outputs.tag }}
      image-id: ${{ steps.build.outputs.id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/sawone-cache
          key: ${{ needs.tools.outputs.cache-key }}
          restore-keys: sawone-vulndb-${{ runner.os }}-
      - name: Load scanner built from source
        if: inputs.scanner-source-path != ''
        run: docker load -q -i "$RUNNER_TEMP/sawone-tools/scanner.tar"
      - name: Build image
        id: build
        env:
          DOCKERFILE: ${{ needs.validate.outputs.dockerfile }}
          CONTEXT: ${{ needs.validate.outputs.build-context }}
        run: |
          set -euo pipefail
          tag="sawone-app:$GITHUB_SHA"
          docker build --pull -f "$GITHUB_WORKSPACE/$DOCKERFILE" -t "$tag" \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            "$GITHUB_WORKSPACE/$CONTEXT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "id=$(docker image inspect --format '{{.Id}}' "$tag")" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/app-image"
          docker save -o "$RUNNER_TEMP/app-image/image.tar" "$tag"
      - name: Scan (container)
        id: scan
        env:
          SCANNER: ${{ needs.tools.outputs.scanner }}
          SCAN_IMAGE: ${{ steps.build.outputs.tag }}
          SCAN_PATH_IN: ${{ inputs.path }}
          SCAN_CONFIG: ${{ inputs.config }}
          SCAN_SEVERITY: ${{ inputs.gate-severity }}
          SCAN_ENFORCE: ${{ inputs.enforce }}
          SCAN_SKIP: ${{ inputs.skip-tools }}
          SCAN_BASELINE: ${{ inputs.baseline-file }}
          SCAN_BLOCK_KEV: ${{ inputs.block-kev }}
          SCAN_EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
        run: |
          set -uo pipefail
          target="$(realpath "$GITHUB_WORKSPACE/$SCAN_PATH_IN")"
          tools="$RUNNER_TEMP/sawone-tools"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$target:$target" -w "$target" -v "$tools:$tools:ro" \
            -e SCAN_ONLY=container -e SCAN_IMAGE -e SCAN_CONFIG -e SCAN_SEVERITY -e SCAN_ENFORCE -e SCAN_SKIP \
            -e SCAN_TOOLS_LOCK="$tools/tools.lock.json" -e SCAN_INTEL_DIR="$tools/intel" \
            -e SCAN_BASELINE -e SCAN_BLOCK_KEV -e SCAN_EPSS_THRESHOLD \
            -e SCAN_CACHE_DIR="$RUNNER_TEMP/sawone-cache" -v "$RUNNER_TEMP/sawone-cache:$RUNNER_TEMP/sawone-cache" \
            -e REPO="$GITHUB_REPOSITORY" -e SHA="$GITHUB_SHA" -e REF="$GITHUB_REF" \
            "$SCANNER" --path "$target" --reports sawone-reports
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reports=$target/sawone-reports" >> "$GITHUB_OUTPUT"
          [ -f "$target/sawone-reports/summary.md" ] && cat "$target/sawone-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outputs.reports != ''
        with:
          name: ${{ inputs.artifact-prefix }}-part-container
          path: ${{ steps.scan.outputs.reports }}
          retention-days: 7
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.build.outcome == 'success'
        with:
          name: ${{ inputs.artifact-prefix }}-app-image
          path: ${{ runner.temp }}/app-image/image.tar
          retention-days: 1
          if-no-files-found: error
      - name: Result
        env:
          CODE: ${{ steps.scan.outputs.code }}
        run: |
          case "$CODE" in
            0) echo "passed" ;;
            1) echo "::error::container gate failed"; exit 1 ;;
            *) echo "::error::scanner error (exit ${CODE:-none})"; exit 2 ;;
          esac

  attack:
    name: attack ${{ matrix.stage }}
    needs: [validate, tools, build]
    # attack the image even when its container gate failed: the report should show everything
    if: >-
      !cancelled() && needs.validate.outputs.attack-stages != '[]' &&
      needs.build.outputs.image-id != ''
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        stage: ${{ fromJSON(needs.validate.outputs.attack-stages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-app-image
          path: ${{ runner.temp }}/app-image
      - name: Load images and check the app image is the one that was built
        env:
          EXPECT_ID: ${{ needs.build.outputs.image-id }}
          TAG: ${{ needs.build.outputs.local-tag }}
          FROM_SOURCE: ${{ inputs.scanner-source-path != '' }}
        run: |
          set -euo pipefail
          [ "$FROM_SOURCE" = true ] && docker load -q -i "$RUNNER_TEMP/sawone-tools/scanner.tar"
          docker load -q -i "$RUNNER_TEMP/app-image/image.tar"
          got="$(docker image inspect --format '{{.Id}}' "$TAG")"
          [ "$got" = "$EXPECT_ID" ] || { echo "::error::app image ID $got does not match the built image $EXPECT_ID"; exit 1; }
      - name: Scan (${{ matrix.stage }})
        id: scan
        env:
          SCANNER: ${{ needs.tools.outputs.scanner }}
          SCAN_ONLY: ${{ matrix.stage }}
          SCAN_IMAGE: ${{ needs.build.outputs.local-tag }}
          SCAN_PATH_IN: ${{ inputs.path }}
          SCAN_CONFIG: ${{ inputs.config }}
          SCAN_SEVERITY: ${{ inputs.gate-severity }}
          SCAN_ENFORCE: ${{ inputs.enforce }}
          SCAN_SKIP: ${{ inputs.skip-tools }}
          SCAN_DAST: "true"
          SCAN_DAST_FULL: ${{ needs.validate.outputs.full-scan }}
          SCAN_BASELINE: ${{ inputs.baseline-file }}
          SCAN_BLOCK_KEV: ${{ inputs.block-kev }}
          SCAN_EPSS_THRESHOLD: ${{ inputs.epss-threshold }}
          SCAN_APP_PORT: ${{ inputs.app-port != 0 && inputs.app-port || '' }}
          SCAN_HEALTH_PATH: ${{ inputs.health-path }}
          SCAN_STARTUP_TIMEOUT: ${{ inputs.startup-timeout }}
          # the IAST settings and token reach only the IAST leg
          DONGTAI_URL: ${{ matrix.stage == 'iast' && inputs.dongtai-url || '' }}
          IAST_RUN_ARGS: ${{ matrix.stage == 'iast' && inputs.iast-run-args || '' }}
          DONGTAI_TOKEN: ${{ matrix.stage == 'iast' && secrets.dongtai-token || '' }}
          # authenticated DAST: the credentials reach only the DAST leg, as environment variables
          SCAN_AJAX_SPIDER: ${{ inputs.dast-ajax-spider }}
          ZAP_AUTH_HEADER: ${{ inputs.dast-auth-header }}
          DAST_AUTH_VALUE: ${{ matrix.stage == 'dast' && secrets.dast-auth-value || '' }}
          DAST_USERNAME: ${{ matrix.stage == 'dast' && secrets.dast-username || '' }}
          DAST_PASSWORD: ${{ matrix.stage == 'dast' && secrets.dast-password || '' }}
        run: |
          set -uo pipefail
          target="$(realpath "$GITHUB_WORKSPACE/$SCAN_PATH_IN")"
          tools="$RUNNER_TEMP/sawone-tools"
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$target:$target" -w "$target" -v "$tools:$tools:ro" \
            -e SCAN_ONLY -e SCAN_IMAGE -e SCAN_CONFIG -e SCAN_SEVERITY -e SCAN_ENFORCE -e SCAN_SKIP \
            -e SCAN_DAST -e SCAN_DAST_FULL -e SCAN_APP_PORT -e SCAN_HEALTH_PATH -e SCAN_STARTUP_TIMEOUT \
            -e DONGTAI_URL -e IAST_RUN_ARGS -e DONGTAI_TOKEN \
            -e SCAN_AJAX_SPIDER -e ZAP_AUTH_HEADER -e DAST_AUTH_VALUE -e DAST_USERNAME -e DAST_PASSWORD \
            -e SCAN_TOOLS_LOCK="$tools/tools.lock.json" -e SCAN_INTEL_DIR="$tools/intel" \
            -e SCAN_BASELINE -e SCAN_BLOCK_KEV -e SCAN_EPSS_THRESHOLD \
            -e SCAN_CACHE_DIR="$RUNNER_TEMP/sawone-cache" -v "$RUNNER_TEMP/sawone-cache:$RUNNER_TEMP/sawone-cache" \
            -e REPO="$GITHUB_REPOSITORY" -e SHA="$GITHUB_SHA" -e REF="$GITHUB_REF" \
            "$SCANNER" --path "$target" --reports sawone-reports
          code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "reports=$target/sawone-reports" >> "$GITHUB_OUTPUT"
          [ -f "$target/sawone-reports/summary.md" ] && cat "$target/sawone-reports/summary.md" >> "$GITHUB_STEP_SUMMARY"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.scan.outputs.reports != ''
        with:
          name: ${{ inputs.artifact-prefix }}-part-${{ matrix.stage }}
          path: ${{ steps.scan.outputs.reports }}
          retention-days: 7
          if-no-files-found: warn
      - name: Result
        env:
          CODE: ${{ steps.scan.outputs.code }}
        run: |
          case "$CODE" in
            0) echo "passed" ;;
            1) echo "::error::gate failed"; exit 1 ;;
            *) echo "::error::scanner error (exit ${CODE:-none})"; exit 2 ;;
          esac

  report:
    name: report
    needs: [validate, tools, gates, build, attack]
    if: always() && needs.validate.result == 'success'
    runs-on: ${{ inputs.runs-on }}
    permissions:
      contents: read
      actions: read # code scanning upload on private repositories
      security-events: write # code scanning upload
    outputs:
      passed: ${{ steps.merge.outputs.passed }}
      failed: ${{ steps.merge.outputs.failed }}
      errors: ${{ steps.merge.outputs.errors }}
      new-blocking: ${{ steps.merge.outputs.new-blocking }}
      artifact: ${{ inputs.artifact-prefix }}-report
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: needs.tools.result == 'success'
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: ${{ inputs.artifact-prefix }}-part-*
          path: ${{ runner.temp }}/parts
      - name: Fetch the previous report (base branch on pull requests, this branch otherwise)
        id: base
        env:
          GH_TOKEN: ${{ github.token }}
          PREFIX: ${{ inputs.artifact-prefix }}
          IS_PR: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          BASE: ${{ github.base_ref }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -uo pipefail
          dir="$RUNNER_TEMP/base"
          mkdir -p "$dir"
          br="$BRANCH"; [ "$IS_PR" = true ] && br="$BASE"
          # the newest report from an earlier run of that branch (this run's report is not uploaded yet)
          id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$PREFIX-report&per_page=50" \
                --jq "[.artifacts[] | select(.expired == false and .workflow_run.head_branch == \"$br\" and .workflow_run.id != $GITHUB_RUN_ID)] | sort_by(.created_at) | last | .id // empty" 2>/dev/null)"
          if [ -z "$id" ]; then
            echo "::notice::No earlier $PREFIX-report from branch $br: every finding is first seen now$([ "$IS_PR" = true ] && echo ' and counts as new')."
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$dir/prev.zip" || exit 0
          unzip -q -o "$dir/prev.zip" findings.json findings-consolidated.json -d "$dir" 2>/dev/null || true
          if [ "$IS_PR" = true ] && [ -f "$dir/findings.json" ]; then
            echo "file=$dir/findings.json" >> "$GITHUB_OUTPUT"
          fi
          if [ -f "$dir/findings-consolidated.json" ]; then
            echo "previous=$dir/findings-consolidated.json" >> "$GITHUB_OUTPUT"
            echo "previous report: artifact $id from $br ($(jq length "$dir/findings-consolidated.json") findings)"
          fi
      - name: Merge reports
        id: merge
        env:
          SCANNER: ${{ needs.tools.outputs.scanner || inputs.scanner-image }}
          FROM_SOURCE: ${{ inputs.scanner-source-path != '' }}
          NEEDS: ${{ toJSON(needs) }}
          EXPECT: ${{ needs.validate.outputs.expected-parts }}
          PREFIX: ${{ inputs.artifact-prefix }}
          ENFORCE: ${{ inputs.enforce }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-scanner-error }}
          BASE_FINDINGS: ${{ steps.base.outputs.file }}
          PREV_FINDINGS: ${{ steps.base.outputs.previous }}
          UNCHANGED: ${{ needs.validate.outputs.unchanged-stages }}
          LANGS: ${{ inputs.report-languages }}
          IS_PR: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          PR_GATE: ${{ inputs.pr-gate }}
          R_IMAGE: ${{ needs.build.outputs.local-tag || 'none (no image built)' }}
          R_IMAGE_ID: ${{ needs.build.outputs.image-id }}
          R_EVENT: ${{ github.event_name }} on ${{ github.ref }}
        run: |
          set -uo pipefail
          tools="$RUNNER_TEMP/sawone-tools"
          parts="$RUNNER_TEMP/parts"
          out="$RUNNER_TEMP/report"
          mkdir -p "$parts" "$out" "$tools"
          mkdir -p "$RUNNER_TEMP/sawone-cache"
          if [ "$FROM_SOURCE" = true ]; then
            if [ -f "$tools/scanner.tar" ]; then docker load -q -i "$tools/scanner.tar"
            else echo "::error::scanner was never built (tools job failed)"; echo "passed=false" >> "$GITHUB_OUTPUT"; exit 2; fi
          fi
          printf '%s' "$NEEDS" | jq 'with_entries(.value |= {result})' > "$out/needs.json"
          # which report part each job is accountable for (matrix legs are checked through --expect)
          jq -n --arg c "$PREFIX-part-container" '{tools: null, build: $c}' > "$out/job-stage.json"
          lock_policy="$(cat "$tools/policy" 2>/dev/null || echo unresolved)"
          lock_time="$(jq -r '.resolved // "?"' "$tools/tools.lock.json" 2>/dev/null || echo '?')"
          sbom="$(find "$parts" -path '*-part-container/raw/sbom-*.cdx.json' | head -1)"
          jq -n --arg image "$R_IMAGE" --arg id "${R_IMAGE_ID:-none}" --arg event "$R_EVENT" --arg scanner "$SCANNER" \
                --arg sbom "${sbom:+CycloneDX (raw/$(basename "$sbom"))}" --arg policy "$lock_policy (resolved $lock_time)" \
            '{"Image built": $image, "Image ID": $id, "SBOM": (if $sbom == "" then "none" else $sbom end),
              "Published / signed / provenance": "not by this workflow — sawone-release.yml, trusted pushes only",
              "Trigger": $event, "Scanner": $scanner, "Tool versions": $policy}' \
            > "$out/release.json"
          srcs=()
          for d in "$parts"/*/; do [ -d "$d" ] && srcs+=("${d%/}"); done
          pr_args=(--languages "$LANGS" --unchanged "$UNCHANGED")
          [ -n "$PREV_FINDINGS" ] && pr_args+=(--previous-findings "$PREV_FINDINGS")
          if [ "$IS_PR" = true ]; then
            pr_args+=(--pr-gate "$PR_GATE")
            [ -n "$BASE_FINDINGS" ] && pr_args+=(--base-findings "$BASE_FINDINGS")
          fi
          docker run --rm -v "$RUNNER_TEMP:$RUNNER_TEMP" --entrypoint python3 -e REPO="$GITHUB_REPOSITORY" \
            -e SHA="$GITHUB_SHA" -e REF="$GITHUB_REF" \
            -e RUN_URL="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" "$SCANNER" \
            /opt/sawone/merge_reports.py --out "$out/merged" --jobs "$out/needs.json" --job-stage "$out/job-stage.json" \
            --release "$out/release.json" --expect "$EXPECT" "${pr_args[@]}" "${srcs[@]}"
          code=$?
          summ="$out/merged/summary.json"
          if [ ! -f "$summ" ]; then
            echo "::error::report merge failed (exit $code)"; echo "passed=false" >> "$GITHUB_OUTPUT"; exit 2
          fi
          failed="$(jq '[.stages[] | select(.status == "failed")] | length' "$summ")"
          errors="$(jq '[.stages[] | select(.status == "error")] | length' "$summ")"
          {
            echo "failed=$failed"
            echo "errors=$errors"
            echo "new-blocking=$(jq -r '.findings.new_blocking // empty' "$summ")"
            echo "passed=$([ "$failed" = 0 ] && [ "$errors" = 0 ] && echo true || echo false)"
            echo "code=$code"
            echo "dir=$out/merged"
          } >> "$GITHUB_OUTPUT"
          cat "$out/merged/summary.md" >> "$GITHUB_STEP_SUMMARY"
          jq -r '.stages[] | select(.status == "error") | "::error title=scanner error::\(.stage) / \(.tool): \(.reason)"' "$summ"
          jq -r '.stages[] | select(.status == "failed") | "::warning title=gate failed::\(.stage) / \(.tool): \(.findings // .reason)"' "$summ"
          exit 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always() && steps.merge.outputs.dir != ''
        with:
          name: ${{ inputs.artifact-prefix }}-report
          path: ${{ steps.merge.outputs.dir }}
          retention-days: 30
          if-no-files-found: error
      - name: Publish to code scanning
        # fork pull requests get a read-only token, so they cannot upload
        if: >-
          always() && steps.merge.outputs.dir != '' &&
          (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository) &&
          (inputs.upload-sarif == 'always' || inputs.upload-sarif == 'true' || (inputs.upload-sarif == 'auto' && github.event.repository.visibility == 'public'))
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: ${{ steps.merge.outputs.dir }}/sarif
      - name: Result
        if: always()
        env:
          FAILED: ${{ steps.merge.outputs.failed }}
          ERRORS: ${{ steps.merge.outputs.errors }}
          ENFORCE: ${{ inputs.enforce }}
          FAIL_ON_ERROR: ${{ inputs.fail-on-scanner-error }}
        run: |
          if [ -z "$ERRORS" ]; then echo "::error::no merged report"; exit 2; fi
          if [ "$ERRORS" -gt 0 ] && { [ "$ENFORCE" = true ] || [ "$FAIL_ON_ERROR" = true ]; }; then
            echo "::error::$ERRORS scanner error(s): a crashed scanner is not a clean result"; exit 2
          fi
          if [ "$FAILED" -gt 0 ] && [ "$ENFORCE" = true ]; then
            echo "::error::$FAILED security gate(s) failed"; exit 1
          fi
          [ "$FAILED" -gt 0 ] && echo "::warning::$FAILED gate(s) failed (report-only mode)"
          echo "report complete"

  defectdojo:
    name: import to DefectDojo
    needs: [tools, report]
    if: >-
      !cancelled() && inputs.enable-defectdojo && needs.report.outputs.errors != '' &&
      (github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ${{ inputs.runs-on }}
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-prefix }}-report
          path: ${{ runner.temp }}/report
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.scanner-source-path != ''
        with:
          name: ${{ inputs.artifact-prefix }}-tools
          path: ${{ runner.temp }}/sawone-tools
      - name: Import
        env:
          SCANNER: ${{ needs.tools.outputs.scanner }}
          FROM_SOURCE: ${{ inputs.scanner-source-path != '' }}
          DEFECTDOJO_URL: ${{ inputs.defectdojo-url }}
          DEFECTDOJO_TOKEN: ${{ secrets.defectdojo-token }}
          DEFECTDOJO_PRODUCT: ${{ inputs.defectdojo-product || github.repository }}
          DEFECTDOJO_ENGAGEMENT: ${{ inputs.defectdojo-engagement || github.ref_name }}
        run: |
          set -euo pipefail
          [ "$FROM_SOURCE" = true ] && docker load -q -i "$RUNNER_TEMP/sawone-tools/scanner.tar"
          docker run --rm -v "$RUNNER_TEMP/report:$RUNNER_TEMP/report:ro" \
            -e DEFECTDOJO_URL -e DEFECTDOJO_TOKEN -e DEFECTDOJO_PRODUCT -e DEFECTDOJO_ENGAGEMENT \
            "$SCANNER" --import-defectdojo "$RUNNER_TEMP/report"
