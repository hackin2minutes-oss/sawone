# Builds and publishes the scanner image.
#   • every Monday: rebuild the latest v1 release so its bundled tools and tool lock stay current
#   • manual run: publish :edge from the branch (release tags untouched)
#   • on a v* tag: publish that version and move the major tag (e.g. :1)
# Images are multi-arch (amd64 + arm64) and signed keylessly with Cosign.
name: release

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "23 2 * * 1"
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  image:
    name: build, push, sign
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push the scanner image
      id-token: write # keyless cosign signature
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Scheduled rebuilds use the latest v1 release, not unreleased main
        if: github.event_name == 'schedule'
        run: |
          set -euo pipefail
          tag="$(git tag -l 'v1.*' --sort=-v:refname | head -1)"
          [ -n "$tag" ] || { echo "::error::no v1.* release tag to rebuild"; exit 1; }
          git checkout --quiet "$tag"
          echo "rebuilding $tag with today's tools"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Resolve the bundled tool lock (tool-version-policy bundled)
        # every scanner image and pip tool pinned by digest/version at build time; a tool that
        # cannot be resolved fails the release instead of shipping a floating tag
        run: |
          python -m pip install --quiet pyyaml
          python scanner/sawone_scan.py --resolve-tools scanner/defaults/tools.lock.json
          cat scanner/defaults/tools.lock.json
      - name: Tags
        id: tags
        run: |
          img="ghcr.io/$(echo "$GITHUB_REPOSITORY_OWNER" | tr '[:upper:]' '[:lower:]')/sawone-scanner"
          day="$(date -u +%Y%m%d)"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            v="${GITHUB_REF#refs/tags/v}"
            tags="$img:latest,$img:$day,$img:$v,$img:${v%%.*}"
          elif [ "$GITHUB_EVENT_NAME" = schedule ]; then
            # scheduled rebuilds refresh the current major line from its latest release tag
            tags="$img:latest,$img:$day,$img:2"
          else
            # manual runs from a branch never move the release tags consumers rely on
            tags="$img:edge,$img:edge-$day"
          fi
          echo "image=$img" >> "$GITHUB_OUTPUT"
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: scanner
          platforms: linux/amd64,linux/arm64
          push: true
          pull: true
          no-cache: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign
        env:
          REF: ${{ steps.tags.outputs.image }}@${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$REF"
